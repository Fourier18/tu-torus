name: Report a problem
description: Something in Tu-Torus didn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language or file
      description: For example main.py, a .bas file, or "the tutor chat".
  - type: textarea
    id: details
    attributes:
      label: Details from the app
      description: In Tu-Torus, open Settings → About → "Copy details for a bug report", then paste here. It has the version, Windows version, and provider and model — no API key and no code.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot, or the code involved if you're comfortable sharing it. Please don't paste your API key.
