version: '3.2'

services:
    api:
        image: ghcr.io/engineer-man/piston
        container_name: piston_api
        restart: always
        privileged: true
        ports:
            - 2000:2000
        volumes:
            # A named volume, not a host bind mount: package installs do rapid
            # recursive directory operations that hit ENOTEMPTY on the Windows
            # bind-mount bridge (virtiofs/9p). A named volume lives on Docker's
            # own Linux filesystem and avoids that entirely.
            - piston_packages:/piston/packages
        tmpfs:
            - /tmp:exec
        environment:
            # [DESIGN.md, Panel 2] defaults are wrong for this app: 3s run timeout
            # would kill any program waiting for input; 1024-char output limit
            # cuts off long programs. Both overridden here per the design's
            # hard requirements.
            - PISTON_RUN_TIMEOUT=300000
            - PISTON_OUTPUT_MAX_SIZE=200000

volumes:
    piston_packages:
